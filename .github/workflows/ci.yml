name: SIREN UA verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: siren-ua-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NODE_ENV: test
      SIREN_DATA_MODE: NOT_CONNECTED
      SIREN_FINANCIAL_MODE: NOT_CONNECTED

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: siren
          POSTGRES_PASSWORD: siren
          POSTGRES_DB: siren_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U siren -d siren_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run lint

      - name: Financial acceptance tests
        run: npm run test:financial

      - name: Spatial acceptance tests
        run: npm run test:spatial

      - name: Production build and boundary smoke
        run: npm run test:runtime-boundary

      - name: PostgreSQL migrations and financial acceptance suite
        env:
          DATABASE_URL: postgresql://siren:siren@127.0.0.1:5432/siren_ci
        run: |
          npm run db:migrate
          npm run test:postgres-subscription
          npm run test:postgres-qualified-payment
          npm run test:postgres-payment-webhook
          npm run test:postgres-payout
          npm run test:postgres-payout-dispatch
          npm run test:postgres-payout-webhook
          npm run test:postgres-payment-adjustment
          npm run test:postgres-partner-engagement
          npm run test:postgres-auto-payout
          npm run test:postgres-financial-rule
          npm run test:postgres-repository
          npm run test:postgres-http

      - name: Demo API contract smoke
        run: npm run test:demo-api

      - name: Browser, accessibility and screenshot tests
        run: npm run test:e2e

      - name: Bundle performance budget
        run: npm run test:performance

      - name: Dependency audit
        run: npm audit --omit=dev
